<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FAMILY SMART</title>
<meta name="description" content="יומן משפחתי">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FAMILY SMART">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="application-name" content="FAMILY SMART">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: sticky top bar, then a toolbar (period + view switch), a type legend, and one big calendar surface.
   Event details open as a bottom sheet on phones and a centered dialog on desktop. */
:root{
  --bg:#FAF7FF; --surface:#FFFFFF; --surface-2:#F3EEFC; --ink:#2A2140; --muted:#6F6688; --line:#E7E0F3;
  --accent:#7C5CD6; --accent-ink:#FFFFFF; --pink:#E86FA6; --teal:#2FB3A6; --sky:#6FAEEA;
  --shadow:0 8px 28px rgba(76,52,140,.10); --scrim:rgba(24,14,48,.42);
  --g-kid1:linear-gradient(135deg,#F59BC2,#B99BF0); --g-kid2:linear-gradient(135deg,#5FD0C3,#7FB4F0); --g-parent:linear-gradient(135deg,#A88BF0,#F2A3C7);
  --exam-bg:#FDE1EC; --exam-fg:#A8306A; --exam-dot:#EC6FA5;
  --study-bg:#FFF2F7; --study-fg:#A8306A; --study-dot:#F4AECD;
  --project-bg:#ECE5FD; --project-fg:#5634B8; --project-dot:#9C7FEE;
  --homework-bg:#E1EFFD; --homework-fg:#21609F; --homework-dot:#6FAEEA;
  --activity-bg:#D7F4F0; --activity-fg:#0B7469; --activity-dot:#3CC4B5;
  --chore-bg:#E3F5E3; --chore-fg:#2B7236; --chore-dot:#78C886;
  --event-bg:#FFF1D2; --event-fg:#865600; --event-dot:#EDB847;
  --rest-bg:#F1EEF7; --rest-fg:#5C5472; --rest-dot:#C3BAD8;
  --makeup-bg:#EEF1F6; --makeup-fg:#4F5B73; --makeup-dot:#9AA8C2;
  --quiz-bg:#FFE6D5; --quiz-fg:#9A4210; --quiz-dot:#F59A5E;
  --alt-bg:#F5E3FA; --alt-fg:#86279A; --alt-dot:#CC7FE3;
  --holiday-bg:#E8F1FB; --holiday-fg:#2D5C8C; --holiday-dot:#A9C9EC;
  --warn-bg:#FFF1D2; --warn-fg:#865600; --bad-bg:#FDE1EC; --bad-fg:#A8306A; --ok-bg:#E3F5E3; --ok-fg:#2B7236;
  --f-display:"Fredoka","Rubik",system-ui,sans-serif;
  --f-body:"Rubik",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --hour:56px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#14101C; --surface:#1E1829; --surface-2:#292138; --ink:#F2EDFB; --muted:#A99FC0; --line:#352C47;
  --accent:#A98CF6; --accent-ink:#1A1426; --pink:#F28DBC; --teal:#5BD3C6; --sky:#8DC2F4;
  --shadow:0 8px 28px rgba(0,0,0,.35); --scrim:rgba(0,0,0,.6);
  --exam-bg:#47203A; --exam-fg:#FFB4D3; --exam-dot:#F27EB2;
  --study-bg:#33192A; --study-fg:#FFB4D3; --study-dot:#B65A88;
  --project-bg:#2F2550; --project-fg:#CDBBFF; --project-dot:#9C7FEE;
  --homework-bg:#1B3350; --homework-fg:#A9D2FA; --homework-dot:#6FAEEA;
  --activity-bg:#123D3A; --activity-fg:#8DEBDF; --activity-dot:#3CC4B5;
  --chore-bg:#1C3A22; --chore-fg:#A6E3AF; --chore-dot:#5FB56E;
  --event-bg:#3D3014; --event-fg:#F6D58A; --event-dot:#D9A433;
  --rest-bg:#2A2538; --rest-fg:#C8C0DB; --rest-dot:#6E6588;
  --makeup-bg:#262B36; --makeup-fg:#BCC6D9; --makeup-dot:#6C7891;
  --quiz-bg:#45291A; --quiz-fg:#FFC7A3; --quiz-dot:#E07F45;
  --alt-bg:#3A1F45; --alt-fg:#ECB8F7; --alt-dot:#B565CF;
  --holiday-bg:#182C42; --holiday-fg:#A8CCF2; --holiday-dot:#4E7FB3;
  --warn-bg:#3D3014; --warn-fg:#F6D58A; --bad-bg:#47203A; --bad-fg:#FFB4D3; --ok-bg:#1C3A22; --ok-fg:#A6E3AF;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#14101C; --surface:#1E1829; --surface-2:#292138; --ink:#F2EDFB; --muted:#A99FC0; --line:#352C47;
  --accent:#A98CF6; --accent-ink:#1A1426; --pink:#F28DBC; --teal:#5BD3C6; --sky:#8DC2F4;
  --shadow:0 8px 28px rgba(0,0,0,.35); --scrim:rgba(0,0,0,.6);
  --exam-bg:#47203A; --exam-fg:#FFB4D3; --exam-dot:#F27EB2;
  --study-bg:#33192A; --study-fg:#FFB4D3; --study-dot:#B65A88;
  --project-bg:#2F2550; --project-fg:#CDBBFF; --project-dot:#9C7FEE;
  --homework-bg:#1B3350; --homework-fg:#A9D2FA; --homework-dot:#6FAEEA;
  --activity-bg:#123D3A; --activity-fg:#8DEBDF; --activity-dot:#3CC4B5;
  --chore-bg:#1C3A22; --chore-fg:#A6E3AF; --chore-dot:#5FB56E;
  --event-bg:#3D3014; --event-fg:#F6D58A; --event-dot:#D9A433;
  --rest-bg:#2A2538; --rest-fg:#C8C0DB; --rest-dot:#6E6588;
  --makeup-bg:#262B36; --makeup-fg:#BCC6D9; --makeup-dot:#6C7891;
  --quiz-bg:#45291A; --quiz-fg:#FFC7A3; --quiz-dot:#E07F45;
  --alt-bg:#3A1F45; --alt-fg:#ECB8F7; --alt-dot:#B565CF;
  --holiday-bg:#182C42; --holiday-fg:#A8CCF2; --holiday-dot:#4E7FB3;
  --warn-bg:#3D3014; --warn-fg:#F6D58A; --bad-bg:#47203A; --bad-fg:#FFB4D3; --ok-bg:#1C3A22; --ok-fg:#A6E3AF;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:2px;border-radius:10px}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tm{unicode-bidi:isolate;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0}

/* ---------- user picker ---------- */
.picker{min-height:100%;display:grid;align-content:center;padding-block:40px;
  background:radial-gradient(36rem 26rem at 90% -5%,color-mix(in srgb,var(--pink) 22%,transparent),transparent 65%),
             radial-gradient(34rem 26rem at 0% 100%,color-mix(in srgb,var(--teal) 20%,transparent),transparent 65%),
             radial-gradient(30rem 22rem at 10% 10%,color-mix(in srgb,var(--sky) 16%,transparent),transparent 60%),var(--bg)}
.picker-in{display:grid;gap:28px;max-width:880px;margin:0 auto;width:100%}
.hello{display:grid;gap:8px;text-align:center;justify-items:center}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:clamp(30px,6vw,44px);letter-spacing:-.01em}
.mark{width:44px;height:44px;border-radius:14px;background:var(--g-parent);display:grid;place-items:center;color:#fff;box-shadow:var(--shadow)}
.mark svg.i{width:24px;height:24px}
.hello p{margin:0;color:var(--muted);font-size:17px}
.ucards{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:680px){.ucards{grid-template-columns:repeat(3,minmax(0,1fr))}}
.ucard{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:22px;display:grid;gap:12px;justify-items:center;text-align:center;box-shadow:var(--shadow);transition:transform .15s ease}
button.ucard:hover{transform:translateY(-3px)}
.av{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-weight:700;font-size:30px}
.av.sm{width:34px;height:34px;font-size:16px}
.av.kid1{background:var(--g-kid1)} .av.kid2{background:var(--g-kid2)} .av.parent,.av.par1,.av.par2{background:var(--g-parent)}
.ucard h2{font-size:24px}
.ucard .sub{color:var(--muted);font-size:14px;margin-top:-8px}
.parent-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{border:0;border-radius:999px;padding:10px 18px;font-weight:600;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;gap:6px}
.btn.soft{background:var(--surface-2);color:var(--ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--exam-bg);color:var(--exam-fg)}
.picker small.priv{color:var(--muted);text-align:center;font-size:13px;max-width:56ch;margin:0 auto;line-height:1.6}

/* ---------- app shell ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:21px}
.brand .mark{width:32px;height:32px;border-radius:10px}
.brand .mark svg.i{width:18px;height:18px}
.top-actions{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
.icon-btn{position:relative;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.badge{position:absolute;top:-5px;inset-inline-end:-5px;min-width:20px;height:20px;border-radius:10px;background:var(--pink);color:#fff;font-size:12px;font-weight:600;display:grid;place-items:center;padding:0 5px}
.me{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 4px 3px 12px;text-align:start}
.me b{display:block;font-weight:600;font-size:14px;line-height:1.2}
.me small{display:block;color:var(--muted);font-size:12px;line-height:1.2}
.me .swap{display:none}
@media (min-width:640px){.me .swap{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-size:13px;font-weight:500;padding-inline:6px 4px;border-inline-start:1px solid var(--line)}}

.greet{padding-block:18px 2px;display:grid;gap:2px}
.greet h1{font-size:clamp(22px,3.4vw,30px)}
.greet p{margin:0;color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:14px 8px}
.period{display:flex;align-items:center;gap:6px;min-width:0}
.period h2{font-size:clamp(19px,2.6vw,24px);min-width:0;padding-inline:4px}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-inline-start:auto}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:4px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:999px;font-weight:500;color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 8px rgba(60,40,120,.12)}
.today-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:500}
.kdot{width:9px;height:9px;border-radius:50%;display:inline-block}
.kdot.kid1{background:var(--pink)} .kdot.kid2{background:var(--teal)}

.legend{display:flex;gap:8px;overflow-x:auto;padding-block:4px 10px;scrollbar-width:none}
.legend::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--bg-t);color:var(--fg-t);border:1px solid transparent;white-space:nowrap;font-size:13px;font-weight:500;flex:none}
.chip svg.i{width:15px;height:15px}
.chip[aria-pressed="false"]{background:transparent;border-color:var(--line);color:var(--muted);text-decoration:line-through}
.note{display:flex;gap:8px;align-items:center;margin:0 0 14px;background:var(--event-bg);color:var(--event-fg);border-radius:12px;padding:8px 12px;font-size:13px;line-height:1.5}
.note svg.i{width:16px;height:16px}

/* ---------- month ---------- */
.month{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}
.mhead,.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.mhead{background:var(--surface-2)}
.mhead div{padding:8px 4px;text-align:center;font-size:13px;font-weight:600;color:var(--muted)}
.mhead .long{display:none}
@media (min-width:760px){.mhead .long{display:inline}.mhead .short{display:none}}
.mcell{min-height:70px;border-top:1px solid var(--line);border-inline-start:1px solid var(--line);padding:5px;display:flex;flex-direction:column;align-items:stretch;gap:4px;cursor:pointer;min-width:0;background:transparent}
.mcell:nth-child(7n+1){border-inline-start:0}
.mcell.sat{background:color-mix(in srgb,var(--surface-2) 45%,transparent)}
.mcell.out .mnum{opacity:.38}
.mcell.sel{background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.mcell:hover{background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.mnum{font-weight:600;font-size:13px;width:26px;height:26px;display:grid;place-items:center;border-radius:50%;font-variant-numeric:tabular-nums;align-self:center}
.mcell.today .mnum{background:var(--accent);color:var(--accent-ink)}
.mpills{display:none}
.mdots{display:flex;flex-wrap:wrap;gap:3px;justify-content:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dot-t)}
.dot.study{background:transparent;border:1.5px dashed var(--dot-t)}
@media (min-width:760px){
  .mcell{min-height:118px;padding:6px}
  .mnum{align-self:flex-start}
  .mpills{display:flex;flex-direction:column;gap:3px;min-width:0}
  .mdots{display:none}
}
.pill{display:flex;align-items:center;gap:4px;border:0;border-radius:7px;padding:2px 6px;font-size:12px;line-height:1.5;background:var(--bg-t);color:var(--fg-t);text-align:start;width:100%;min-width:0}
.pill svg.i{width:12px;height:12px}
.pill .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.pill .kl{font-size:10px;font-weight:700;opacity:.8}
.more{font-size:11px;color:var(--muted);padding-inline-start:4px}

/* ---------- lists / rows ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;display:grid;gap:10px;align-content:start;min-width:0}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.panel-head h3{font-size:18px}
.agenda{margin-top:14px}
.rows{display:grid;gap:6px}
.row{display:flex;align-items:stretch;gap:4px;background:var(--bg-t);color:var(--fg-t);border-radius:12px;padding:4px;min-width:0}
.row.study{background:transparent;border:1.5px dashed var(--dot-t)}
.row.rest{background:transparent;border:1px solid var(--line);color:var(--muted)}
.check{flex:none;width:34px;border:0;background:transparent;display:grid;place-items:center;border-radius:9px}
.check span{width:22px;height:22px;border-radius:7px;border:2px solid currentColor;display:grid;place-items:center;opacity:.75}
.check span svg.i{width:14px;height:14px;opacity:0}
.check[aria-pressed="true"] span{background:currentColor;opacity:1}
.check[aria-pressed="true"] span svg.i{opacity:1;stroke:var(--surface)}
.row-main{flex:1;min-width:0;display:flex;align-items:center;gap:8px;border:0;background:transparent;text-align:start;padding:5px 6px;border-radius:9px}
.row-main>svg.i{opacity:.85}
.row-text{display:grid;min-width:0;flex:1}
.row-title{font-weight:500;line-height:1.35;overflow-wrap:anywhere}
.row-meta{font-size:12.5px;opacity:.8;line-height:1.4}
.row.done .row-title{text-decoration:line-through;opacity:.6}
.kb{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700}
.kb.kid1{background:var(--g-kid1)} .kb.kid2{background:var(--g-kid2)}
.req-tag{font-size:11.5px;font-weight:600;border-radius:999px;padding:1px 8px;background:var(--surface);color:var(--accent);white-space:nowrap}
.empty{color:var(--muted);font-size:14px;padding:6px 4px}

/* ---------- week ---------- */
.summary{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.stat{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:12px;background:var(--bg-t);color:var(--fg-t);font-size:14px}
.stat b{font-family:var(--f-display);font-size:18px;font-weight:600}
.week{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:1000px){.week{grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}.week .row-main{padding:4px}.week .row-main>svg.i{display:none}}
.wday{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.wday.sat{background:color-mix(in srgb,var(--surface-2) 55%,var(--surface))}
.wday.today{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 22%,transparent)}
.whead{display:flex;align-items:center;justify-content:space-between;gap:6px;border:0;background:transparent;padding:2px 4px 6px;text-align:start;border-radius:8px}
.whead b{font-family:var(--f-display);font-weight:600;font-size:16px}
.whead span{color:var(--muted);font-size:13px}
.wday.today .whead span{color:var(--accent);font-weight:600}

/* ---------- day ---------- */
.day{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:920px){.day{grid-template-columns:minmax(0,1fr) 340px}}
.side{display:grid;gap:14px;align-content:start}
.timeline{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:12px 0 18px;box-shadow:var(--shadow);min-width:0}
.allday{display:grid;gap:6px;padding:0 12px 12px;border-bottom:1px solid var(--line);margin-bottom:14px}
.allday-label{font-size:12px;color:var(--muted);font-weight:600}
.tl{position:relative;height:calc(var(--hour) * 15);margin-inline-start:60px;margin-inline-end:12px}
.hour{position:absolute;inset-inline:0;border-top:1px solid var(--line);height:0}
.hour label{position:absolute;right:-52px;top:-10px;font-size:12px;color:var(--muted)}
.tev{position:absolute;padding:1px 2px}
.tev .row{height:100%;padding:2px;overflow:hidden}
.tev .row-main{align-items:flex-start;padding:3px 5px}
.tev .check{width:28px;align-items:start;padding-top:3px}
.tev.short .row-meta{display:none}
.now{position:absolute;inset-inline:-8px 0;border-top:2px solid var(--pink);z-index:3}
.now::before{content:"";position:absolute;inset-inline-start:-4px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--pink)}
.progress{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--teal),var(--accent))}
.rem{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--bg-t);color:var(--fg-t);border:0;text-align:start;width:100%}
.rem .when{font-weight:600;font-size:12.5px;white-space:nowrap;background:var(--surface);border-radius:999px;padding:1px 8px}
.rem .t{flex:1;min-width:0;overflow-wrap:anywhere}

/* ---------- sheet / dialogs ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fade .15s ease}
.sheet{background:var(--surface);width:100%;max-width:540px;max-height:90vh;overflow:auto;border-radius:26px 26px 0 0;
  padding:22px max(20px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
  box-shadow:var(--shadow);display:grid;gap:14px;animation:up .2s ease}
@media (min-width:700px){.scrim{align-items:center;padding:24px}.sheet{border-radius:26px}}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.scrim,.sheet{animation:none}button.ucard{transition:none}}
.sheet-top{display:flex;align-items:center;gap:8px;justify-content:space-between}
.sheet h2{font-size:24px;line-height:1.25}
.facts{display:grid;gap:0;margin:0;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.facts div{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;padding:9px 12px;border-top:1px solid var(--line)}
.facts div:first-child{border-top:0}
.facts dt{color:var(--muted);font-size:13.5px}
.facts dd{margin:0;overflow-wrap:anywhere}
.src{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:flex-start}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.callout{border-radius:14px;padding:10px 12px;background:var(--surface-2);font-size:14px;line-height:1.55}
.callout.ok{background:var(--chore-bg);color:var(--chore-fg)}
.callout.warn{background:var(--event-bg);color:var(--event-fg)}

form.f{display:grid;gap:12px}
.field{display:grid;gap:5px}
.field label,.field legend{font-size:13.5px;font-weight:500;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;min-width:0}
.field textarea{min-height:76px;resize:vertical}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

.radios{display:flex;flex-wrap:wrap;gap:8px}
.radios label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:7px 12px;color:var(--ink);font-size:14px;cursor:pointer}
.radios label:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.err{color:var(--exam-fg);font-size:13.5px;margin:0}
.reqitem{display:grid;gap:8px;border:1px solid var(--line);border-radius:16px;padding:12px}
.reqitem .who{display:flex;align-items:center;gap:8px;font-weight:500}
.reqitem .st{margin-inline-start:auto;font-size:12.5px;border-radius:999px;padding:2px 10px;background:var(--surface-2)}

.fab{position:fixed;left:calc(18px + env(safe-area-inset-left,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;border:0;border-radius:999px;padding:14px 20px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:16px;display:flex;align-items:center;gap:6px;box-shadow:0 10px 26px color-mix(in srgb,var(--accent) 40%,transparent)}
.fab svg.i{width:20px;height:20px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:14px;max-width:min(92vw,440px);text-align:center;box-shadow:var(--shadow)}
main{padding-bottom:110px}
/* ---------- v2: navigation, import, schedule, settings ---------- */
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:0 8px}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:none;border:0;background:transparent;padding:8px 14px;border-radius:12px;font-weight:500;color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.nav button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 8px rgba(60,40,120,.10)}
.nav .dotn{min-width:18px;height:18px;border-radius:9px;background:var(--pink);color:#fff;font-size:11px;display:inline-grid;place-items:center;padding:0 5px}
.screen-head{display:grid;gap:4px;padding-block:18px 12px}
.screen-head h1{font-size:clamp(22px,3.4vw,30px)}
.screen-head p{margin:0;color:var(--muted);max-width:70ch}
.grid2{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:900px){.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:grid;gap:12px;align-content:start;min-width:0}
.card h3{font-size:18px}
.muted{color:var(--muted)}
.small{font-size:13px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;border-radius:999px;padding:1px 8px;white-space:nowrap;line-height:1.6}
.tag.new{background:var(--ok-bg);color:var(--ok-fg)}
.tag.moved{background:var(--warn-bg);color:var(--warn-fg)}
.tag.cancel{background:var(--bad-bg);color:var(--bad-fg)}
.tag.sample{background:var(--surface-2);color:var(--muted)}
.row.cancelled .row-title{text-decoration:line-through;opacity:.65}
.pill.cancelled .t{text-decoration:line-through;opacity:.7}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.statbox{background:var(--surface-2);border-radius:14px;padding:10px 12px;display:grid;gap:2px}
.statbox b{font-family:var(--f-display);font-size:26px;font-weight:600;line-height:1.1}
.statbox span{font-size:13px;color:var(--muted)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table.t{border-collapse:collapse;width:100%;font-size:14px;min-width:520px}
table.t th,table.t td{padding:8px 10px;text-align:start;border-top:1px solid var(--line);vertical-align:top}
table.t th{background:var(--surface-2);font-size:12.5px;color:var(--muted);font-weight:600;border-top:0;position:sticky;top:0}
table.t td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
details.fold{border:1px solid var(--line);border-radius:14px;background:var(--surface)}
details.fold>summary{cursor:pointer;padding:10px 14px;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"+";margin-inline-start:auto;color:var(--muted);font-weight:400}
details.fold[open]>summary::after{content:"–"}
details.fold>.fold-body{padding:0 12px 12px}
.drop{border:2px dashed color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:18px;padding:22px;display:grid;gap:10px;justify-items:center;text-align:center;background:color-mix(in srgb,var(--accent) 5%,var(--surface))}
.drop input[type=file]{max-width:100%}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.review{display:grid;gap:8px;border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.review .actions .btn{padding:7px 14px;font-size:14px}
/* schedule */
.days{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:760px){.days{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1100px){.days{grid-template-columns:repeat(3,minmax(0,1fr))}}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;display:grid;gap:10px;align-content:start;min-width:0}
.dcard.today{border-color:var(--accent)}
.dcard h3{font-size:18px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.schoolrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface-2);border-radius:12px;padding:8px 10px;font-size:14px}
.schoolrow input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 8px;width:7.2em}
.schoolrow input:disabled{opacity:.8}
.blk{display:flex;align-items:center;gap:8px;background:var(--activity-bg);color:var(--activity-fg);border-radius:12px;padding:8px 10px}
.blk.training{background:var(--homework-bg);color:var(--homework-fg)}
.blk.other{background:var(--rest-bg);color:var(--rest-fg)}
.blk .bt{flex:1;min-width:0;display:grid}
.blk .bt b{font-weight:500;overflow-wrap:anywhere}
.blk .bt span{font-size:12.5px;opacity:.85}
.blk .icon-btn{width:34px;height:34px;border-radius:10px;background:var(--surface);border-color:transparent;color:var(--ink)}
.addblk{border:1.5px dashed var(--line);background:transparent;border-radius:12px;padding:8px;color:var(--accent);font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:14px;cursor:pointer;color:var(--ink)}
.checks label:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.school-band{position:absolute;inset-inline:0;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--holiday-dot) 16%,transparent) 0 8px,transparent 8px 16px);border-radius:10px;z-index:0}
.school-band>span{position:absolute;inset-inline-end:8px;top:6px;font-size:12px;font-weight:600;color:var(--holiday-fg);white-space:nowrap;background:var(--surface);border-radius:999px;padding:1px 8px}
.tev{z-index:1}
.hist{display:grid;gap:4px;margin:0;padding:0;list-style:none;font-size:13.5px}
.hist li{display:flex;gap:8px}
.hist li span:first-child{color:var(--muted);white-space:nowrap}
.setrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:end}
@media (max-width:520px){.setrow{grid-template-columns:1fr}}
.inline-confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.schoolrow .pair{display:inline-flex;align-items:center;gap:4px}

/* ---------- v4: multi-day bars, month at a glance, certainty ---------- */
.mweeks{display:grid}
.mweek{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.mweek .mcell:first-child{border-inline-start:0}
.mweek .mcell:nth-child(7n+1){border-inline-start:0}
.mbars{position:absolute;inset-inline:0;top:36px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:20px;row-gap:2px;pointer-events:none;z-index:1}
.lane-space{display:block;flex:none;height:calc(var(--lanes,0) * 22px)}
.bar{pointer-events:auto;display:flex;align-items:center;gap:4px;margin-inline:3px;border:0;border-radius:7px;padding:0 6px;font-size:12px;font-weight:500;background:var(--bg-t);color:var(--fg-t);min-width:0;overflow:hidden;white-space:nowrap;text-align:start}
.bar.cont{border-start-start-radius:0;border-end-start-radius:0;margin-inline-start:0}
.bar.more{border-start-end-radius:0;border-end-end-radius:0;margin-inline-end:0}
.bar .t{overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.bar .rng{font-size:11px;opacity:.85;flex:none}
.bar svg.i{width:12px;height:12px}
.mcell.off{background:color-mix(in srgb,var(--holiday-bg) 60%,transparent)}
.mcell.past .pill,.mcell.past .mini{opacity:.6}
.mminis{display:flex;flex-direction:column;gap:2px;min-width:0}
.mini{display:block;font-size:10px;line-height:1.55;font-weight:600;border-radius:4px;padding:0 3px;background:var(--bg-t);color:var(--fg-t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.mminis .more{font-size:10px;padding:0;text-align:center}
@media (min-width:760px){.mminis{display:none}}
@media (max-width:759px){.mbars{top:35px;grid-auto-rows:16px}.lane-space{height:calc(var(--lanes,0) * 18px)}.bar{font-size:10.5px;padding:0 4px;margin-inline:1px}.bar .rng,.bar svg.i{display:none}}
.pill.pending,.mini.pending{background:transparent;outline:1.5px dashed var(--dot-t);outline-offset:-1.5px}
.row.pending{background:transparent;border:1.5px dashed var(--dot-t)}
.stat.pending{background:transparent;border:1.5px dashed var(--line);color:var(--muted)}
.tag.pend{background:var(--warn-bg);color:var(--warn-fg)}
.tag.sure{background:var(--ok-bg);color:var(--ok-fg)}
.tag svg.i{width:11px;height:11px}
.certainty-legend{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);margin:-2px 0 10px}
.pill.demo{width:auto;display:inline-flex;cursor:default}
.msum{display:grid;gap:8px;margin-bottom:12px}
.msum h3{font-size:17px}
.glance{display:grid;gap:12px}
.gweek h4{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:600}
.gl{display:flex;align-items:center;gap:8px;width:100%;border:0;background:var(--bg-t);color:var(--fg-t);border-radius:10px;padding:7px 10px;text-align:start;min-width:0}
.gl .d{font-size:12.5px;font-weight:600;white-space:nowrap;min-width:5.2em}
.gl .t{flex:1;min-width:0;overflow-wrap:anywhere}
.gl.pending{background:transparent;border:1.5px dashed var(--dot-t)}
.gl.past{opacity:.55}
.gl.cancelled .t{text-decoration:line-through}
.wbanner{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.wbanner .bar{padding:7px 12px;font-size:14px;margin:0;border-radius:12px}
.wbanner .bar svg.i{width:16px;height:16px}
.wday.off{background:color-mix(in srgb,var(--holiday-bg) 45%,var(--surface))}
/* ================= v5 theme: young, bright, energetic =================
   Layout: same screens and structure. Soft grey page, white cards with a gentle shadow, bold black/blue Fredoka headings,
   strong colour fills for the big things (exams, assignments, activities, events), light tints for the smaller ones.
   Each kid has a personal accent pair: kid 1 fuchsia + blue, kid 2 blue + turquoise, parents purple + blue. */
:root{
  --fuchsia:#FF3B8D; --blue:#2979FF; --black:#171717; --white:#FFFFFF; --purple:#A855F7; --teal:#00CDB7;
  --orange:#FF7A00; --sun:#FFD23F;                                   /* supporting: home tasks, holidays */
  --fuchsia-ink:#B8005A; --blue-ink:#1550D6; --purple-ink:#7A22CE; --teal-ink:#00756A;  /* coloured TEXT on white (≥4.5:1) */
  --bg:#F6F6FA; --surface:#FFFFFF; --surface-2:#F1F1F7; --ink:#171717; --muted:#5E5E6E; --line:#E9E9F1;
  --heading-2:#2979FF;                                                 /* blue headings – large text only */
  --k1:var(--purple); --k2:var(--blue); --k1-ink:var(--purple-ink);   /* personal accent (parents by default) */
  --accent:var(--k1); --accent-ink:#171717;
  --pink:var(--fuchsia); --sky:var(--blue);
  --shadow:0 1px 2px rgba(23,23,23,.04),0 8px 24px rgba(23,23,23,.07);
  --shadow-pop:0 10px 26px rgba(23,23,23,.16);
  --scrim:rgba(23,23,23,.5);
  --g-kid1:linear-gradient(135deg,#FF3B8D,#2979FF); --g-kid2:linear-gradient(135deg,#2979FF,#00CDB7); --g-parent:linear-gradient(135deg,#A855F7,#2979FF);
  /* calendar types: strong fill = big thing, tint = smaller thing. --X-ico = icon colour on the --X-dot circle */
  --exam-bg:#FF3B8D; --exam-fg:#171717; --exam-dot:#FF3B8D; --exam-ico:#171717;
  --quiz-bg:#FFE0EE; --quiz-fg:#A3004A; --quiz-dot:#FF3B8D; --quiz-ico:#171717;
  --project-bg:#A855F7; --project-fg:#171717; --project-dot:#A855F7; --project-ico:#171717;
  --alt-bg:#F1E4FE; --alt-fg:#6B21A8; --alt-dot:#A855F7; --alt-ico:#171717;
  --homework-bg:#E1ECFF; --homework-fg:#1449B8; --homework-dot:#2979FF; --homework-ico:#171717;
  --study-bg:#FFF0F6; --study-fg:#A3004A; --study-dot:#FF3B8D; --study-ico:#171717;
  --activity-bg:#00CDB7; --activity-fg:#171717; --activity-dot:#00CDB7; --activity-ico:#171717;
  --chore-bg:#FFE8D1; --chore-fg:#8A3D00; --chore-dot:#FF7A00; --chore-ico:#171717;
  --event-bg:#171717; --event-fg:#FFFFFF; --event-dot:#171717; --event-ico:#FFFFFF;
  --holiday-bg:#FFD23F; --holiday-fg:#171717; --holiday-dot:#FFD23F; --holiday-ico:#171717; --holiday-cell:#FFF6D1; --holiday-text:#5C4A00;
  --makeup-bg:#ECECF2; --makeup-fg:#45454F; --makeup-dot:#9A9AA8; --makeup-ico:#171717;
  --rest-bg:#F2F0F8; --rest-fg:#55506A; --rest-dot:#C7BFE0; --rest-ico:#171717;
  --warn-bg:#FFF1C2; --warn-fg:#6B4E00; --bad-bg:#FFE0EE; --bad-fg:#A3004A; --ok-bg:#D4F7F2; --ok-fg:#00655B;
  --f-display:"Fredoka","Rubik",system-ui,sans-serif;
}
:root[data-kid="kid1"]{ --k1:var(--fuchsia); --k2:var(--blue); --k1-ink:var(--fuchsia-ink); }
:root[data-kid="kid2"]{ --k1:var(--blue); --k2:var(--teal); --k1-ink:var(--blue-ink); }

@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#171717; --surface:#222226; --surface-2:#2C2C32; --ink:#FFFFFF; --muted:#B4B4C2; --line:#34343C;
  --heading-2:#5C9BFF; --fuchsia-ink:#FF7AB3; --blue-ink:#8AB6FF; --purple-ink:#D2A8FF; --teal-ink:#4FE3D2;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); --scrim:rgba(0,0,0,.65);
  --quiz-bg:#4A1530; --quiz-fg:#FFB3D4; --alt-bg:#35204F; --alt-fg:#DDBBFF; --homework-bg:#14284D; --homework-fg:#A9C6FF;
  --study-bg:#2E1422; --study-fg:#FFB3D4; --chore-bg:#40220A; --chore-fg:#FFC799;
  --event-bg:#FFFFFF; --event-fg:#171717; --event-dot:#FFFFFF; --event-ico:#171717;
  --holiday-cell:#3A3210; --holiday-text:#FFE680; --makeup-bg:#2A2A30; --makeup-fg:#C4C4CF; --rest-bg:#26222F; --rest-fg:#CFC8E2;
  --warn-bg:#3D3010; --warn-fg:#FFE08A; --bad-bg:#4A1530; --bad-fg:#FFB3D4; --ok-bg:#0E3A35; --ok-fg:#7FF0E2;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#171717; --surface:#222226; --surface-2:#2C2C32; --ink:#FFFFFF; --muted:#B4B4C2; --line:#34343C;
  --heading-2:#5C9BFF; --fuchsia-ink:#FF7AB3; --blue-ink:#8AB6FF; --purple-ink:#D2A8FF; --teal-ink:#4FE3D2;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); --scrim:rgba(0,0,0,.65);
  --quiz-bg:#4A1530; --quiz-fg:#FFB3D4; --alt-bg:#35204F; --alt-fg:#DDBBFF; --homework-bg:#14284D; --homework-fg:#A9C6FF;
  --study-bg:#2E1422; --study-fg:#FFB3D4; --chore-bg:#40220A; --chore-fg:#FFC799;
  --event-bg:#FFFFFF; --event-fg:#171717; --event-dot:#FFFFFF; --event-ico:#171717;
  --holiday-cell:#3A3210; --holiday-text:#FFE680; --makeup-bg:#2A2A30; --makeup-fg:#C4C4CF; --rest-bg:#26222F; --rest-fg:#CFC8E2;
  --warn-bg:#3D3010; --warn-fg:#FFE08A; --bad-bg:#4A1530; --bad-fg:#FFB3D4; --ok-bg:#0E3A35; --ok-fg:#7FF0E2;
  color-scheme:dark;
}

body{background:var(--bg);color:var(--ink)}
h1,h2,h3{font-weight:700;letter-spacing:-.01em}
.hl{color:var(--k1-ink)}
.yr{color:var(--heading-2)}
:focus-visible{outline:3px solid var(--k2);outline-offset:2px}

/* ---------- header & navigation ---------- */
.top{background:color-mix(in srgb,var(--surface) 92%,transparent);border-bottom:0;box-shadow:0 1px 0 var(--line)}
.brand{font-size:22px}
.brand .mark,.logo .mark{background:linear-gradient(135deg,var(--k1),var(--k2));color:#171717}
.nav{gap:6px;padding-block:2px 10px}
.nav button{border-radius:999px;font-weight:600;color:var(--muted);padding:8px 16px}
.nav button[aria-current="page"]{background:var(--ink);color:var(--surface);box-shadow:none}
.nav .dotn{background:var(--fuchsia);color:#171717;font-weight:700}
.me{border-color:transparent;background:var(--surface-2)}
.me .swap{color:var(--blue-ink)}

/* ---------- buttons: round, strong colours, black bold text (contrast ≥4.5) ---------- */
.btn{border-radius:999px;font-weight:700;padding:11px 20px;background:var(--k1);color:#171717;box-shadow:0 4px 14px color-mix(in srgb,var(--k1) 35%,transparent);transition:transform .12s ease,box-shadow .12s ease}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px color-mix(in srgb,var(--k1) 45%,transparent)}
.btn.soft{background:var(--surface-2);color:var(--ink);box-shadow:none}
.btn.ghost{background:transparent;border:2px solid var(--ink);color:var(--ink);box-shadow:none}
.btn.danger{background:var(--bad-bg);color:var(--bad-fg);box-shadow:none}
.btn.dark{background:var(--ink);color:var(--surface);box-shadow:none}
.icon-btn{border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:14px}
.today-btn{border:2px solid var(--blue);color:var(--blue-ink);background:var(--surface);font-weight:700}
.seg{background:var(--surface);box-shadow:var(--shadow)}
.seg button{font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);box-shadow:none}
.fab{background:linear-gradient(135deg,var(--k1),var(--k2));color:#171717;font-size:19px;font-weight:700;padding:15px 24px;box-shadow:var(--shadow-pop)}
@media (prefers-reduced-motion:reduce){.btn{transition:none}.btn:hover{transform:none}}

/* ---------- white cards, gentle shadow ---------- */
.card,.panel,.month,.timeline,.wday,.dcard,.ucard,.sheet,details.fold{background:var(--surface);border:0;box-shadow:var(--shadow)}
.card,.panel{border-radius:22px}
.review{border:0;background:var(--surface-2)}
.statbox{background:var(--surface-2)}
.statbox b{color:var(--ink)}

/* ---------- colourful icons ---------- */
.ico{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--dot-t);color:var(--ico-t,#171717)}
.ico svg.i{width:15px;height:15px;stroke-width:2.4}
.row-main>.ico{opacity:1}
.chip .ico{width:20px;height:20px}
.chip .ico svg.i{width:12px;height:12px}
.chip{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:600;padding:5px 12px 5px 6px}
.chip[aria-pressed="false"]{box-shadow:none;background:transparent}
.chip[aria-pressed="false"] .ico{background:var(--surface-2);color:var(--muted)}

/* ---------- rows ---------- */
.row{border-radius:14px}
.row-title{font-weight:600}
.row.rest{border:0;background:var(--rest-bg);color:var(--rest-fg)}
.row.study{border:2px dashed var(--dot-t);background:var(--study-bg)}

/* ---------- month calendar: bold, colourful, clear ---------- */
.month{border-radius:26px}
.mhead{background:var(--surface)}
.mhead div{color:var(--blue-ink);font-weight:700;font-size:13px;padding-block:12px}
.mcell{border-color:var(--line)}
.mcell.sat{background:color-mix(in srgb,var(--surface-2) 70%,transparent)}
.mcell.sel{background:color-mix(in srgb,var(--k2) 9%,var(--surface));box-shadow:inset 0 0 0 2px var(--k2)}
.mcell:hover{background:color-mix(in srgb,var(--k1) 7%,var(--surface))}
.mnum{font-weight:700;font-size:14px;width:30px;height:30px}
.mcell.today .mnum{background:var(--k1);color:#171717;box-shadow:0 0 0 3px color-mix(in srgb,var(--k1) 30%,transparent)}
.mcell.off{background:var(--holiday-cell)}
.mbars{top:40px}
.lane-space{height:calc(var(--lanes,0) * 22px + 4px)}
@media (max-width:759px){.mbars{top:39px}.lane-space{height:calc(var(--lanes,0) * 18px + 4px)}}
.pill{border-radius:8px;font-weight:600;padding:3px 7px}
.pill svg.i{stroke-width:2.6}
.mini{border-radius:5px}
.bar{font-weight:700}
.wday.off{background:var(--holiday-cell)}
.wday.today{box-shadow:0 0 0 3px var(--k1),var(--shadow)}
.whead b{font-size:17px}
.wday.today .whead span{color:var(--k1-ink)}
.mcell.today{background:color-mix(in srgb,var(--k1) 6%,var(--surface))}
.dcard.today{box-shadow:0 0 0 3px var(--k1),var(--shadow)}
.week .wday{border-radius:20px}

/* ---------- progress bars (single measure: value always written as text next to the bar) ---------- */
.progress{height:12px;border-radius:6px;background:var(--surface-2)}
.progress i{border-radius:6px;background:linear-gradient(90deg,var(--k1),var(--k2))}
:root[dir="rtl"] .progress i{background:linear-gradient(270deg,var(--k1),var(--k2))}

/* ---------- home hero with a personal greeting ---------- */
.hero{position:relative;overflow:hidden;background:var(--surface);border-radius:28px;box-shadow:var(--shadow);padding:22px;margin-top:16px;display:grid;gap:18px}
.hero-main{position:relative;z-index:1;display:grid;gap:4px;max-width:36rem}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.02em;color:var(--blue-ink)}
.hero h1{font-size:clamp(28px,5vw,42px);line-height:1.1;color:var(--ink)}
.motto{margin:0;font-size:17px;color:var(--muted);font-weight:500}
.hero-deco{position:absolute;inset:0;pointer-events:none;z-index:0}
.hero-deco .blob{position:absolute;border-radius:50%}
.hero-deco .b1{width:180px;height:180px;background:var(--k1);inset-inline-end:-50px;top:-60px;opacity:.95}
.hero-deco .b2{width:110px;height:110px;background:var(--k2);inset-inline-end:90px;top:-40px;opacity:.9}
.hero-deco .b3{width:26px;height:26px;background:var(--teal);inset-inline-end:200px;top:38px}
.hero-deco .b4{width:14px;height:14px;background:var(--purple);inset-inline-end:150px;top:96px}
.hero-deco svg{position:absolute;inset-inline-end:36px;top:70px;width:46px;height:46px;fill:var(--sun);stroke:#171717;stroke-width:1.5}
@media (max-width:640px){.hero-deco .b1{width:120px;height:120px;top:-50px;inset-inline-end:-40px}.hero-deco .b2{width:70px;height:70px;inset-inline-end:50px;top:-30px}.hero-deco .b3{inset-inline-end:120px;top:20px}.hero-deco .b4,.hero-deco svg{display:none}.hero-main{padding-top:40px}}
.hero-stats{position:relative;z-index:1;display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.bubble{border:0;border-radius:20px;padding:14px 16px;display:grid;gap:2px;text-align:start;color:#171717;min-width:0}
.bubble .lbl{font-size:13px;font-weight:700;opacity:.85}
.bubble b{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.bubble .sub{font-size:13.5px;font-weight:600}
.bubble.c1{background:var(--k1)}
.bubble.c2{background:var(--k2)}
.bubble.c3{background:var(--teal)}
.bubble.c4{background:var(--sun)}
.bubble.c5{background:var(--purple)}
:root[data-kid="kid2"] .bubble.c3{background:var(--fuchsia)}
button.bubble{cursor:pointer;transition:transform .12s ease}
button.bubble:hover{transform:translateY(-2px)}
.bubble .progress{background:rgba(255,255,255,.55);height:10px;margin-top:4px}
.bubble .progress i{background:#171717}
.kidtiles{position:relative;z-index:1;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.kidtile{border:0;border-radius:20px;padding:14px;background:var(--surface-2);display:grid;gap:6px;text-align:start;color:var(--ink)}
.kidtile .who{display:flex;align-items:center;gap:10px}
.kidtile .who b{font-family:var(--f-display);font-size:20px}

/* ---------- exam prep ---------- */
.prep{display:grid;gap:10px}
.prep-item{display:grid;gap:6px;border:0;background:var(--surface-2);border-radius:16px;padding:10px 12px;text-align:start;color:var(--ink);width:100%}
.prep-top{display:flex;align-items:center;gap:8px}
.prep-top .t{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.prep-top .when{font-size:12.5px;font-weight:700;color:var(--k1-ink);white-space:nowrap}
.prep-bar{display:flex;align-items:center;gap:8px}
.prep-bar .progress{flex:1}
.prep-bar .val{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.steps{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.steps button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:var(--surface-2);border-radius:12px;padding:9px 12px;text-align:start;font-weight:600;color:var(--ink)}
.steps .box{width:24px;height:24px;border-radius:8px;border:2.5px solid var(--ink);display:grid;place-items:center;flex:none}
.steps .box svg.i{width:14px;height:14px;opacity:0;stroke:#171717;stroke-width:3}
.steps button[aria-pressed="true"] .box{background:var(--k1);border-color:var(--k1)}
.steps button[aria-pressed="true"] .box svg.i{opacity:1}
.steps button[aria-pressed="true"] span:last-child{text-decoration:line-through;opacity:.65}

/* ---------- picker ---------- */
.picker{background:radial-gradient(30rem 22rem at 92% -6%,color-mix(in srgb,var(--fuchsia) 30%,transparent),transparent 65%),
  radial-gradient(28rem 22rem at 4% 104%,color-mix(in srgb,var(--teal) 28%,transparent),transparent 65%),
  radial-gradient(24rem 18rem at 8% 6%,color-mix(in srgb,var(--blue) 22%,transparent),transparent 60%),var(--bg)}
.logo{font-size:clamp(34px,7vw,52px)}
.hello p{font-size:19px;font-weight:600;color:var(--ink)}
.ucard{border-radius:28px;position:relative;overflow:hidden}
.ucard::before{content:"";position:absolute;inset-inline:0;top:0;height:8px;background:var(--g-parent)}
.ucard.kid1::before{background:var(--g-kid1)}
.ucard.kid2::before{background:var(--g-kid2)}
.ucard h2{font-size:28px}
.av{color:#171717}
.av.sm{color:#171717}
.kb{color:#171717}

/* ---------- misc ---------- */
.note{border-radius:14px;font-weight:500}
.tag{font-weight:700}
.stat{font-weight:600;border-radius:14px}
.stat b{font-weight:700}
.msum h3{font-size:19px}
.screen-head h1{font-size:clamp(26px,4vw,36px)}
.school-band span{color:var(--teal-ink)}
.school-band{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--teal) 16%,transparent) 0 8px,transparent 8px 16px)}
.now{border-top-color:var(--fuchsia)}
.now::before{background:var(--fuchsia)}
.rem .when{color:var(--ink)}
.toast{background:var(--ink);color:var(--surface);border-radius:999px;font-weight:600}
.check span{border-width:2.5px}
.prep-item .progress,.prep-bar .progress{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line)}
.sheet .prep-bar .progress{background:var(--surface-2);box-shadow:none}
.note{background:var(--warn-bg);color:var(--warn-fg)}

/* ================= v6: consistent event colours, personal looks, phone bottom bar ================= */
:root{
  --f-display:"Rubik",system-ui,sans-serif;
  /* event colours – the same for every child */
  --exam-bg:#FF3B8D; --exam-fg:#171717; --exam-dot:#FF3B8D;               /* מבחן – ורוד, מלא */
  --quiz-bg:#F1E4FE; --quiz-fg:#6B21A8; --quiz-dot:#A855F7;               /* בוחן – סגול, בהיר */
  --project-bg:#2979FF; --project-fg:#171717; --project-dot:#2979FF;      /* עבודה להגשה – כחול, מלא */
  --alt-bg:#E1ECFF; --alt-fg:#1449B8; --alt-dot:#2979FF;                  /* הערכה חלופית – כחול, בהיר */
  --activity-bg:#00CDB7; --activity-fg:#171717; --activity-dot:#00CDB7;   /* חוג / אימון – טורקיז */
  --homework-bg:#FFE8D1; --homework-fg:#8A3D00; --homework-dot:#FF7A00;   /* משימות אישיות – כתום */
  --chore-bg:#FFE8D1; --chore-fg:#8A3D00; --chore-dot:#FF7A00;
  --study-bg:#FFF0F6; --study-fg:#A3004A; --study-dot:#FF3B8D;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --quiz-bg:#35204F; --quiz-fg:#DDBBFF; --alt-bg:#14284D; --alt-fg:#A9C6FF; --homework-bg:#40220A; --homework-fg:#FFC799; --chore-bg:#40220A; --chore-fg:#FFC799;
}}
:root[data-theme="dark"]{ --quiz-bg:#35204F; --quiz-fg:#DDBBFF; --alt-bg:#14284D; --alt-fg:#A9C6FF; --homework-bg:#40220A; --homework-fg:#FFC799; --chore-bg:#40220A; --chore-fg:#FFC799; }
/* personal accents: kid 1 fuchsia + blue · kid 2 blue + teal on black · parents purple with all colours */
:root[data-kid="kid2"]{ --k1:var(--blue); --k2:var(--teal); --k1-ink:var(--blue-ink); }
:root[data-kid="parent"]{ --k1:var(--purple); --k2:var(--teal); --k1-ink:var(--purple-ink); }
body,button,input,select,textarea{font-family:"Rubik",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
h1,h2,h3,.brand,.logo,.bubble b,.statbox b,.stat b,.kidtile .who b{font-family:"Rubik",system-ui,sans-serif;font-weight:800}

/* hero: kid 1 – white, rings of movement */
.hero-deco .blob.b1,.hero-deco .blob.b2,.hero-deco svg{display:none}
.hero-deco .ring{position:absolute;border-radius:50%}
.hero.kid1 .r1{width:170px;height:170px;border:18px solid var(--fuchsia);inset-inline-end:-64px;top:-74px}
.hero.kid1 .r2{width:96px;height:96px;border:11px solid var(--blue);inset-inline-end:66px;top:-50px}
.hero.kid1 .b3{inset-inline-end:44px;top:96px;width:16px;height:16px}
.hero.kid1 .b4{inset-inline-end:96px;top:70px}
.hero h1{font-size:clamp(28px,4.6vw,40px);line-height:1.15}
/* hero: kid 2 – black, speed stripes */
.hero.kid2{background:#171717;color:#FFFFFF}
.hero.kid2 h1{color:#FFFFFF}
.hero.kid2 .hl{color:var(--teal)}
.hero.kid2 .eyebrow{color:#8AB6FF}
.hero.kid2 .motto{color:#C9C9D4}
.hero.kid2 .stripe{position:absolute;inset-inline-end:-60px;width:300px;transform:rotate(26deg);transform-origin:center}
:root[dir="rtl"] .hero.kid2 .stripe{transform:rotate(-26deg)}
.hero.kid2 .s1{height:28px;top:24px;background:var(--blue)}
.hero.kid2 .s2{height:12px;top:66px;background:var(--teal);inset-inline-end:-40px}
.hero.kid2 .s3{height:6px;top:90px;background:var(--purple);inset-inline-end:-20px}
.hero.kid2 .bubble.c1{background:var(--blue)}
.hero.kid2 .bubble.c2{background:var(--teal)}
.hero.kid2 .bubble.c3{background:#FFFFFF}
.hero.kid2 .bubble.c3 .progress{background:#E9E9F1}
:root[data-kid="kid2"] .bubble.c3{background:#FFFFFF}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .hero.kid2{background:#0B0B0D;box-shadow:0 0 0 1px #34343C} }
:root[data-theme="dark"] .hero.kid2{background:#0B0B0D;box-shadow:0 0 0 1px #34343C}
/* hero: parents – calm white with a balanced band of all colours */
.hero.parent .band{position:absolute;inset-inline:0;top:0;height:8px;display:grid;grid-template-columns:repeat(4,1fr)}
.hero.parent .band i:nth-child(1){background:var(--fuchsia)}
.hero.parent .band i:nth-child(2){background:var(--blue)}
.hero.parent .band i:nth-child(3){background:var(--purple)}
.hero.parent .band i:nth-child(4){background:var(--teal)}
.hero.parent{padding-top:28px}
.kidtile{border-top:5px solid var(--purple)}
.kidtiles .kidtile:nth-child(1){border-top-color:var(--fuchsia)}
.kidtiles .kidtile:nth-child(2){border-top-color:var(--blue)}
.kidtile .progress i{background:var(--purple)}
.kidtiles .kidtile:nth-child(1) .progress i{background:var(--fuchsia)}
.kidtiles .kidtile:nth-child(2) .progress i{background:var(--blue)}
.hero.parent .bubble.c4{background:var(--purple)}
.ucard.kid2::before{background:linear-gradient(90deg,#171717,#2979FF,#00CDB7)}
.ucard.parent::before,.ucard:not(.kid1):not(.kid2)::before{background:linear-gradient(90deg,#FF3B8D,#2979FF,#A855F7,#00CDB7)}
:root{--g-kid2:linear-gradient(135deg,#2979FF,#00CDB7)}
.av.kid2{border-radius:14px}

/* labels: long on big screens, short in the phone bar */
.nav .lbl-short{display:none}
/* ---------- phone: clear bottom navigation ---------- */
@media (max-width:720px){
  .top{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--surface)}
  .nav{position:fixed;z-index:40;left:calc(10px + env(safe-area-inset-left,0px));right:calc(10px + env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));
       background:#171717;border-radius:24px;padding:7px;display:flex;gap:4px;overflow-x:auto;box-shadow:var(--shadow-pop)}
  .nav button{flex:1 0 56px;min-height:56px;flex-direction:column;justify-content:center;gap:2px;padding:4px 6px;border-radius:18px;color:#FFFFFF;font-size:11.5px;position:relative}
  .nav button svg.i{width:21px;height:21px}
  .nav button[aria-current="page"]{background:var(--k1);color:#171717}
  .nav .lbl-long{display:none}
  .nav .lbl-short{display:inline}
  .nav .dotn{position:absolute;top:3px;inset-inline-start:calc(50% + 6px);min-width:17px;height:17px;font-size:10.5px}
  main{padding-bottom:170px}
  .fab{bottom:calc(92px + env(safe-area-inset-bottom,0px));padding:13px 18px;font-size:17px}
  .toast{bottom:calc(160px + env(safe-area-inset-bottom,0px))}
  .hero{padding:20px 18px}
  .hero.kid2 .stripe{width:220px}
}
@media (max-width:720px) and (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .nav{box-shadow:0 0 0 1px #34343C} }

/* ---------- gentle motion ---------- */
@keyframes rise{from{opacity:.0;transform:translateY(8px)}to{opacity:1;transform:none}}
main>.hero,main>.prep,main>.screen-head,main>section,main>.grid2,main>.days,main>.card{animation:rise .22s ease-out both}
.btn:active,.bubble:active,.nav button:active,.pill:active,.gl:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){main>*{animation:none!important}.btn:active,.bubble:active,.nav button:active,.pill:active,.gl:active{transform:none}}
@media (max-width:380px){
  .topbar{gap:8px}
  .brand{font-size:17px;gap:6px}
  .brand .mark{width:28px;height:28px}
  .me small{display:none}
  .me{padding-inline-start:8px}
  .me .av.sm{width:30px;height:30px;font-size:14px}
  .topbar{gap:6px}
  .icon-btn{width:38px;height:38px}
}

/* ================= v7 ================= */
/* cloud status chip */
.cloud{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:700;background:var(--surface-2);color:var(--ink)}
.cloud svg.i{width:16px;height:16px}
.cloud.ok{background:var(--ok-bg);color:var(--ok-fg)}
.cloud.warn,.cloud.ro{background:var(--warn-bg);color:var(--warn-fg)}
.cloud.local{background:var(--bad-bg);color:var(--bad-fg)}
@media (max-width:480px){.cloud span{display:none}.cloud{padding:8px}}

/* compact month: number, training dot, event count */
.mtop{display:flex;align-items:center;gap:3px;min-width:0}
.mtop .mnum{flex:none}
.tdot{width:7px;height:7px;border-radius:50%;background:var(--teal);flex:none}
.mcount{margin-inline-start:auto;min-width:18px;height:18px;border-radius:9px;background:var(--ink);color:var(--surface);font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 4px;font-variant-numeric:tabular-nums}
@media (max-width:759px){
  .mcell{min-height:64px;padding:4px 3px}
  .mnum{width:26px;height:26px;font-size:13px}
  .mcount{min-width:16px;height:16px;font-size:10px}
  .mini{font-size:9.5px;padding:0 2px}
  .mhead div{padding-block:8px;font-size:12px}
}
@media (max-width:359px){.mini{font-size:9px}.mcell{padding:3px 2px}.mnum{width:24px;height:24px;font-size:12px}}

/* day card (bottom sheet) – personal colour band */
.sheet-day{padding-top:0;overflow:auto}
.dayhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin:0 -20px 4px;padding:22px 20px 16px;background:linear-gradient(135deg,var(--k1),var(--k2));color:#171717;border-radius:26px 26px 0 0}
.dayhead h2{color:#171717;font-size:24px}
.dayhead .eyebrow{color:#171717;opacity:.85}
.dayhead .small{font-weight:700}
.dayhead .icon-btn{background:rgba(255,255,255,.75)}
:root[data-kid="kid2"] .dayhead{background:#171717;color:#FFFFFF}
:root[data-kid="kid2"] .dayhead h2,:root[data-kid="kid2"] .dayhead .eyebrow{color:#FFFFFF}
:root[data-kid="kid2"] .dayhead .small{color:var(--teal)}

/* exam card extras */
.soft-card{box-shadow:none!important;background:var(--surface-2)!important;padding:14px!important;gap:8px!important}
.soft-card h3{font-size:16px}
.xrow{display:grid;gap:3px}
.xrow b{font-size:14px}
.xlist{margin:0;padding-inline-start:18px;display:grid;gap:4px;font-size:14px}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tchips span{background:var(--surface);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600}

/* flashcards */
.fcset h3{display:flex;align-items:center;gap:8px}
.fc-q{font-size:22px;line-height:1.35}
.fc-opts{display:grid;gap:8px}
.fc-opt{min-height:52px;border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 14px;text-align:start;font-weight:600;font-size:16px;color:var(--ink)}
.fc-opt:hover:not(:disabled){border-color:var(--k1)}
.fc-opt.right{border-color:var(--ok-fg);background:var(--ok-bg);color:var(--ok-fg)}
.fc-opt.wrong{border-color:var(--bad-fg);background:var(--bad-bg);color:var(--bad-fg)}
.fc-opt:disabled{cursor:default}
.fc-done{display:grid;justify-items:center;gap:4px;padding:18px;background:var(--surface-2);border-radius:20px}
.fc-done b{font-size:48px;font-weight:800;color:var(--k1-ink)}
#fc-num{font-size:20px;max-width:12rem}

/* parents space */
.inline-form{gap:8px}
.shop-row{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:12px;padding:6px 8px 6px 10px;min-height:48px}
.shop-row label{flex:1;display:flex;align-items:center;gap:10px;font-weight:600;min-width:0}
.shop-row input{width:22px;height:22px;accent-color:var(--k1);flex:none}
.shop-row.bought span{text-decoration:line-through;opacity:.6}
.shop-row .icon-btn{width:38px;height:38px;box-shadow:none;background:var(--surface)}

/* navigation: "more" on phones */
.nav .more-btn{display:none}
.more-item{display:flex;align-items:center;gap:12px;min-height:56px;border:0;border-radius:16px;background:var(--surface-2);padding:0 16px;font-size:16px;font-weight:600;color:var(--ink);text-align:start}
@media (max-width:720px){
  .nav .more-tab{display:none}
  .nav .more-btn{display:flex;flex:1 0 56px;min-height:56px;flex-direction:column;justify-content:center;align-items:center;gap:2px;border:0;background:transparent;border-radius:18px;color:#FFFFFF;font-size:11.5px;font-weight:600}
  .nav .more-btn svg.i{width:21px;height:21px}
  .nav .more-btn.on{background:var(--k1);color:#171717}
  .nav{overflow-x:visible}
  .nav button{flex:1 1 0;min-width:0}
}
.req-tag,.tag{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.row-main{flex-wrap:wrap}
/* event count: a corner marker on phones only (desktop already lists "+N more") */
.mcell{position:relative}
.mcount{display:none}
@media (max-width:759px){
  .mcount{display:grid;position:absolute;top:3px;inset-inline-end:3px;margin:0;min-width:15px;height:15px;border-radius:8px;background:var(--k2);color:#171717;font-size:9.5px;font-weight:800;padding:0 3px;box-shadow:0 0 0 2px var(--surface)}
  :root[data-kid="kid1"] .mcount{background:var(--blue)}
  .tdot{width:6px;height:6px}
}

/* web version: connect-this-device screen */
.gate{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom));background:linear-gradient(150deg,#FF3B8D 0%,#2979FF 55%,#00CDB7 100%)}
.gate-card{width:100%;max-width:420px;background:var(--surface);border-radius:28px;padding:28px 22px;display:grid;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.18)}
.gate-brand{font-weight:800;letter-spacing:.06em;font-size:15px;color:var(--ink);opacity:.7}
.gate h1{margin:0;font-size:28px}
.gate-sub{margin:0;line-height:1.6}
.gate-or{text-align:center;font-size:13px;font-weight:700;opacity:.65}
.gate-foot{margin:0}
.gate .btn{width:100%;justify-content:center}
#web-code{font-size:22px;letter-spacing:.12em;text-align:center;direction:ltr;text-transform:uppercase}
.web-code{font-size:30px;font-weight:800;letter-spacing:.14em;text-align:center;padding:6px 0;font-variant-numeric:tabular-nums}
</style>

<script>
/* ================= web version: the family's own Firebase project =================

    newCode:null, members:null, confirmRemove:null, importInfo:null };

  const nm = k => (typeof NM === 'function' ? NM(k) : k);

function layoutTimed(evs) {
  const items = evs.map(e => { const s = toMin(e.start); return { e, s, en: e.end ? Math.max(toMin(e.end), s + 15) : s + 60 }; })
    .sort((a, b) => a.s - b.s || b.en - a.en);
  const clusters = []; let cur = [], curEnd = -1;
  for (const it of items) {
    if (cur.length && it.s >= curEnd) { clusters.push(cur); cur = []; curEnd = -1; }
    cur.push(it); curEnd = Math.max(curEnd, it.en);
  }
  if (cur.length) clusters.push(cur);
  for (const c of clusters) {
    const cols = [];
    for (const it of c) { let i = cols.findIndex(end => end <= it.s); if (i < 0) { i = cols.length; cols.push(0); } cols[i] = it.en; it.col = i; }

  }
  return items;

  const now = new Date(), nm = now.getHours() * 60 + now.getMinutes();
  const nowLine = ds === TODAY_ISO && nm >= H0 * 60 && nm <= H1 * 60 ? `<div class="now" style="top:${(nm - H0 * 60) / 60 * hh}px" aria-label="עכשיו"></div>` : '';
  const doable = list.filter(e => !e.isSpan && TYPES[e.type].doable && !isOff(e)), doneN = doable.filter(isDone).length;
  const pct = doable.length ? Math.round(doneN / doable.length * 100) : 0;
  const rems = remindersFor(ds);
  return `<div class="day">
    <div class="timeline">
      ${allday.length ? `<div class="allday"><span class="allday-label">מבחנים, הגשות ואירועים של היום</span><div class="rows">${allday.map(itemRow).join('')}</div></div>` : ''}
      <div class="tl">${hours}${bandHTML}${blocks}${nowLine}</div>
    </div>
    <div class="side">
      <div class="panel">
        <div class="panel-head"><h3>המשימות שלי היום</h3><span class="tm">${doneN}/${doable.length}</span></div>
        <div class="progress" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
        <div class="rows">${doable.length ? doable.map(rowHTML).join('') : '<div class="empty">אין משימות לסמן היום.</div>'}</div>
      </div>
      <div class="panel">
        <div class="panel-head"><h3>תזכורות</h3><span class="small muted">7 הימים הקרובים</span></div>
        ${pendSoon.length ? `<div class="small muted">${plural(pendSoon.length, 'אירוע אחד', 'אירועים')} בשבוע הקרוב ${pendSoon.length === 1 ? 'ממתין' : 'ממתינים'} לאישור הורה, ולכן ${pendSoon.length === 1 ? 'אין עליו' : 'אין עליהם'} תזכורת.</div>` : ''}
        ${rems.length ? rems.map(e => `<button class="rem" style="${tv(e.type)}" data-action="open" data-id="${H(e.id)}"><span class="when">${whenLabel(diffDays(ds, e.date))}</span><span class="t">${H(e.title)}${isParent() && ui.kid === 'both' ? ' · ' + e.owners.map(k => KIDS[k].name).join(', ') : ''}</span></button>`).join('') : '<div class="empty">אין מבחנים או הגשות בשבוע הקרוב.</div>'}
      </div>
    </div>
  </div>`;
}

function reasonNo(e, k) {
  const p = profile(k), a = e.audience.find(x => x.grade === p.grade);
  if (!a) return 'שכבה אחרת';
  if (a.classes !== 'all' && !a.classes.includes(p.cls)) return `מיועד ל־${a.classes.map(c => gradeLabel(a.grade, c)).join(', ')}`;
  if (e.group) return e.group === 'science' ? 'מיועד לכיתות מדעיות' : 'מיועד לכיתות רגילות';
  return '';
}
function previewHTML(pv) {
  if (pv.loading) return `<div class="card"><h3>קורא את הקובץ…</h3><p class="muted" style="margin:0">${H(pv.fileName)}</p></div>`;
  if (pv.error) return `<div class="callout no"><b>לא הצלחתי לקרוא את הקובץ.</b> ${H(pv.error)}</div>`;
  const { parsed, rec } = pv;
  if (rec.aborted) return `<div class="callout no"><b>הייבוא נעצר.</b> ${H(rec.reason)}</div>`;
  const evs = rec.events, hasPrev = !!S.school;
  const per = k => evs.filter(e => kidResult(e, k) === 'yes').sort((a, b) => a.date.localeCompare(b.date));
  const revN = evs.filter(e => e.status !== 'cancelled' && Object.keys(KIDS).some(k => kidResult(e, k) === 'review')).length;
  const kinds = { exam:'מבחן', quiz:'בוחן', project:'עבודה / פרויקט', alt:'הערכה חלופית', makeup:'מועד ב׳', holiday:'חג / חופשה', event:'אירוע' };
  const typeCount = Object.keys(kinds).map(kd => [kd, evs.filter(e => e.kind === kd).length]).filter(x => x[1]);
  const CH = { created:'חדש', dateChanged:'הוזז', cancelled:'בוטל', missing:'ייתכן שבוטל', detailsChanged:'פרטים עודכנו', textChanged:'נוסח עודכן', restored:'חזר ללוח' };
  const changes = hasPrev ? rec.changes : [];
  const table = (rows, cols) => `<div class="tablewrap"><table class="t"><thead><tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
  const kidTable = k => table(per(k).map(e => { const m = matchInfo(e, k); return `<tr><td class="num">${dm(e.date)} ${DSHORT[parse(e.date).getDay()]}</td><td><span class="tag" style="${tv(KIND2TYPE[e.kind])};background:var(--bg-t);color:var(--fg-t)">${kinds[e.kind]}</span></td><td>${H(e.subjects.join(', ') || '—')}</td><td>${H(e.title)}${e.status === 'cancelled' ? ' <span class="tag cancel">בוטל</span>' : ''}</td><td class="small">${H(m.reason)}${!m.certain && !decided(e, k) ? ' <span class="tag moved">לא ודאי</span>' : ''}</td><td class="small muted">${H(e.where.sheet)} · ${e.where.cell}</td></tr>`; }), ['תאריך','סוג','מקצוע','מה כתוב בלוח','סיבת השיוך','מיקום בקובץ']);
  const notFor = k => { const p = profile(k); return evs.filter(e => e.grade === p.grade && kidResult(e, k) === 'no').sort((a, b) => a.date.localeCompare(b.date)); };
  const notTable = k => table(notFor(k).map(e => `<tr><td class="num">${dm(e.date)}</td><td>${H(e.title)}</td><td class="small">${H(matchInfo(e, k).reason)}</td></tr>`), ['תאריך','מה כתוב בלוח','למה לא שויך']);
  return `<div class="card">
    <h3>תצוגה מקדימה – ${H(pv.fileName)}</h3>
    <p class="small muted" style="margin:0">עדיין לא נשמר כלום. בודקים, ואז לוחצים "שמירה ביומן".</p>
    <div class="statgrid">
      <div class="statbox"><b>${evs.length}</b><span>אירועים ב־${parsed.coveredMonths.length} חודשים</span></div>
      ${Object.keys(KIDS).map(k => `<div class="statbox"><b>${per(k).length}</b><span>ל${KIDS[k].name} (${gradeLabel(profile(k).grade, profile(k).cls)})</span></div>`).join('')}
      <div class="statbox"><b>${revN}</b><span>לבדיקה שלך</span></div>
    </div>
    <div class="small muted">סוגים: ${typeCount.map(([kd, n]) => `${kinds[kd]} ${n}`).join(' · ')}${parsed.issues.length ? ` · <b>הערות קריאה:</b> ${parsed.issues.map(i => H(i.sheet + ': ' + i.problem)).join('; ')}` : ''}</div>
    ${hasPrev ? `<div class="callout ${changes.length ? 'warn' : 'ok'}"><b>${changes.length ? `${changes.length} שינויים מאז הייבוא הקודם` : 'אין שינויים מאז הייבוא הקודם.'}</b>
      ${changes.length ? `<ul style="margin:6px 0 0;padding-inline-start:18px">${changes.slice(0, 40).map(c => `<li>${CH[c.type] || c.type}: ${H(c.title)} – ${dm(c.date)}${c.type === 'dateChanged' ? ` (היה ${dm(c.from)})` : ''}</li>`).join('')}</ul>` : ''}</div>` : ''}
    ${Object.keys(KIDS).map(k => `<details class="fold"><summary><span class="kb ${k}">${KIDS[k].initial}</span>מה שויך ל${KIDS[k].name} (${per(k).length})</summary><div class="fold-body">${kidTable(k)}</div></details>
      <details class="fold"><summary>אירועים של שכבת ${profile(k).grade}׳ שלא שויכו ל${KIDS[k].name} (${notFor(k).length})</summary><div class="fold-body">${notTable(k)}</div></details>`).join('')}

  </div>`;
}

    const st = { pending:['warn','ממתינה לאישור'], approved:['ok','אושרה'], declined:['no','לא אושרה'] }[r.status];
    reqBlock = `<div class="callout ${st[0]}"><b>בקשה ${st[1]}:</b> ${what}${r.reason ? ` – "${H(r.reason)}"` : ''}

    : e.status === 'missing' ? `<div class="callout warn"><b>ייתכן שבוטל.</b> האירוע לא הופיע בייבוא האחרון. אם הוא יהיה חסר גם בייבוא הבא, הוא יסומן כמבוטל.</div>` : '';
  const HN = { created:'נוסף ללוח', dateChanged:'הוזז', cancelled:'בוטל', missing:'לא הופיע בלוח', detailsChanged:'הפרטים עודכנו', textChanged:'הנוסח עודכן', restored:'חזר ללוח' };
  const hist = e.source === 'school' && e.history && e.history.length ? `<details class="fold"><summary>היסטוריית שינויים (${e.history.length})</summary><div class="fold-body"><ul class="hist">
    ${e.history.map(h => { const d = new Date(h.at); return `<li><span>${d.getDate()}.${d.getMonth() + 1}</span><span>${HN[h.type] || h.type}${h.type === 'dateChanged' ? `: מ־${dm(h.from)} ל־${dm(h.to)}` : h.from && h.type !== 'dateChanged' ? `: "${H(h.from)}" ← "${H(h.to)}"` : ''}</span></li>`; }).join('')}
  </ul></div></details>` : '';
  const canRequest = !isParent() && !t.school && !(r && r.status === 'pending');
  const examish = EXAMISH.includes(e.type) && !isOff(e);
  return `<div class="sheet-top"><span class="chip" style="${tv(e.type)}">${I(e.type)}${H(typeLabel(e))}</span>${changeTag(e)}<button class="icon-btn" data-action="close" aria-label="סגירה" style="margin-inline-start:auto">${I('x')}</button></div>
    <h2>${H(e.title)}</h2>
    ${statusBlock}
    ${e.source === 'school' && EXAMISH.includes(e.type) && !isOff(e) ? (isPending(e)
      ? `<div class="callout warn"><b>? ממתין לאישור הורה.</b> לא בטוח שהאירוע הזה שייך ל${e.owners.map(k => KIDS[k].name).join(' ול')}, ולכן אין עליו תזכורות עד שהורה יאשר.</div>`
      : `<div class="callout ok">${I('check')} <b>שיוך ודאי.</b> ${H(e.owners.map(k => decided(e, k) ? 'אושר על ידי הורה' : matchInfo(e, k).reason).join(' · '))}</div>`) : ''}
    <dl class="facts">

      <div><dt>שעה</dt><dd>${timeHTML(e)}${e.source === 'school' && !e.start ? ' <span class="small muted">(השעה לא מופיעה בלוח)</span>' : ''}</dd></div>

      ${e.details ? `<div><dt>פרטים</dt><dd>${H(e.details)}</dd></div>` : ''}
      ${e.audience ? `<div><dt>מיועד ל</dt><dd>${audText(e.audience)}${e.group ? (e.group === 'regular' ? ' · כיתות רגילות' : ' · כיתות מדעיות') : ''}</dd></div>` : ''}
      ${isParent() ? `<div><dt>של</dt><dd>${kids}</dd></div>` : ''}
      ${isParent() && e.source === 'school' ? e.owners.map(k => `<div><dt>למה ${KIDS[k].name}</dt><dd>${decided(e, k) ? 'אושר על ידי הורה' : H(matchInfo(e, k).reason)}</dd></div>`).join('') : ''}

  const k = ui.schedKid, b = m.bid ? (S.schedule[k][m.dow].blocks || []).find(x => x.id === m.bid) : null;
  return `<div class="sheet-top"><h2>${b ? 'עריכת חוג או אימון' : 'הוספת חוג או אימון'} – ${KIDS[k].name}</h2><button class="icon-btn" data-action="close" aria-label="סגירה">${I('x')}</button></div>
    <form class="f" id="blockform">

      <fieldset class="field"><legend>סוג</legend><div class="radios">${Object.entries(BLOCK_KINDS).map(([v, l]) => `<label><input type="radio" name="kind" value="${v}" ${(b ? b.kind : 'activity') === v ? 'checked' : ''}> ${l}</label>`).join('')}</div></fieldset>
      <fieldset class="field"><legend>${b ? 'יום' : 'באילו ימים? (אפשר כמה)'}</legend><div class="checks">${DAYS.map((d, i) => `<label><input type="${b ? 'radio' : 'checkbox'}" name="days" value="${i}" ${i === m.dow ? 'checked' : ''}> ${d}</label>`).join('')}</div></fieldset>
      <div class="two">
        <div class="field"><label for="bk-start">משעה</label><input id="bk-start" type="time" name="start" required value="${b ? b.start : ''}"></div>
        <div class="field"><label for="bk-end">עד שעה</label><input id="bk-end" type="time" name="end" required value="${b ? b.end : ''}"></div>
      </div>
      <div class="field"><label for="bk-place">מקום (לא חובה)</label><input id="bk-place" name="place" value="${H(b ? b.place || '' : '')}"></div>
      <div class="field"><label for="bk-notes">הערות (לא חובה)</label><input id="bk-notes" name="notes" value="${H(b ? b.notes || '' : '')}" placeholder="למשל: להביא בגדי ספורט"></div>
      <p class="err" id="bk-err" hidden></p>
